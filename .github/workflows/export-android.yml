name: Android preview

on:
  push:
    branches:
      - codex/android-preview-2026-10-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  export-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK Android
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Instalar Godot e templates Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o engine.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Preparar SDK Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
          keytool -genkeypair -keystore "$RUNNER_TEMP/mobile-preview.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Preview'

      - name: Importar recursos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for directory in docs tools; do
            if [ -d "$directory" ]; then touch "$directory/.gdignore"; fi
          done
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then exit 1; fi

      - name: Testar multitoque e cenas reais
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 res://tests/test_mobile_controls.tscn 2>&1 | tee build/mobile-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/mobile-tests.log; then exit 1; fi

      - name: Configurar exportador Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, json, re
          folder = pathlib.Path.home() / '.config/godot'
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'editor_settings-4.7.tres'
          text = path.read_text() if path.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {'export/android/android_sdk_path': os.environ['ANDROID_HOME'], 'export/android/java_sdk_path': os.environ['JAVA_HOME']}.items():
              text = re.sub(r'^' + re.escape(key) + r'=.*\n?', '', text, flags=re.MULTILINE)
              text += key + '=' + json.dumps(value) + '\n'
          path.write_text(text)
          PY

      - name: Gerar APK assinado para teste
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/mobile-preview.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Android Preview' build/RespeitavelPublico-Android.apk 2>&1 | tee build/android-export.log
          test -s build/RespeitavelPublico-Android.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/RespeitavelPublico-Android.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/RespeitavelPublico-Android.apk | tee build/apk-info.txt

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RespeitavelPublico-Android
          path: build/RespeitavelPublico-Android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Testar abertura no emulador Android
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name mobile-preview --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --force
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd mobile-preview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell wm size 1080x1920
          adb shell wm density 240
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb install build/RespeitavelPublico-Android.apk
          adb logcat -c
          adb shell monkey -p com.rbtzinn.respeitavelpublico.preview.autofire -c android.intent.category.LAUNCHER 1
          sleep 35
          adb shell pidof com.rbtzinn.respeitavelpublico.preview.autofire
          adb exec-out screencap -p > build/Android-Menu.png
          adb shell input tap 430 570
          sleep 2
          adb shell input tap 430 495
          sleep 25
          adb exec-out screencap -p > build/Android-Jogo.png
          adb logcat -d > build/android-device.log
          if grep -E 'FATAL EXCEPTION|SCRIPT ERROR:|Parse Error:' build/android-device.log; then exit 1; fi

      - name: Disponibilizar verificacoes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-verificacoes
          path: |
            build/*.log
            build/apk-info.txt
            build/Android-*.png
          retention-days: 14
