name: Source snapshot for Android development
on:
  push:
    branches: [codex/android-online-2026-10-09]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
      - name: Package runtime source
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.')
          with zipfile.ZipFile('/tmp/jogo-runtime-source.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=3) as z:
              for path in root.rglob('*'):
                  if path.is_file() and not any(p in {'.git', '.godot', 'docs', 'tools', 'build', 'node_modules'} for p in path.parts):
                      z.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-runtime-source
          path: /tmp/jogo-runtime-source.zip
          retention-days: 3
