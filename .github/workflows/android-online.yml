name: Testes e versões
# Testa sempre. Uma tag v<VERSION_NAME> publica a versão nos Releases do GitHub
# (ZIP do Windows e, com a chave de assinatura configurada, APK do Android).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-online-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar servidor
        working-directory: server
        run: npm ci --ignore-scripts && npm test
      - name: Instalar Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o engine.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Importar e verificar multitoque
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for directory in server scripts docs tools; do
            if [ -d "$directory" ]; then touch "$directory/.gdignore"; fi
          done
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 res://tests/test_mobile_controls.tscn 2>&1 | tee build/mobile-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/mobile-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_game_updates.tscn 2>&1 | tee build/update-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/update-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_room_codes.tscn 2>&1 | tee build/room-code-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/room-code-tests.log; then exit 1; fi
      - name: Verificar partida completa via relay
        env:
          GODOT: Godot_v4.7.2-stable_linux.x86_64
        run: python3 tests/run_relay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-online-verificacoes
          path: build/*.log
          retention-days: 14
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
      - name: Conferir versão da tag
        run: python3 scripts/make_release_manifest.py --tag "$GITHUB_REF_NAME" --out /tmp/check.json --windows check.zip
      - name: Preparar assinatura permanente
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ALIAS" && test -n "$RELEASE_PASSWORD"
          python3 - <<'PY'
          import os, pathlib, base64
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.keystore'
          path.write_bytes(base64.b64decode(os.environ['RELEASE_KEY'], validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@v4
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar engine e templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o engine.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q templates.tpz 'templates/android_release.apk' 'templates/windows_release_x86_64.exe' 'templates/version.txt'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          if [ "$HAS_ANDROID_KEY" = true ]; then sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'; fi
      - name: Configurar exportador e importar
        run: |
          set -euo pipefail
          if [ "$HAS_ANDROID_KEY" = true ]; then
            python3 - <<'PY'
          import os, pathlib, json
          folder = pathlib.Path.home() / '.config/godot'
          folder.mkdir(parents=True, exist_ok=True)
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {'export/android/android_sdk_path': os.environ['ANDROID_HOME'], 'export/android/java_sdk_path': os.environ['JAVA_HOME']}.items():
              text += key + '=' + json.dumps(value) + '\n'
          (folder / 'editor_settings-4.7.tres').write_text(text)
          PY
          fi
          mkdir -p build/publish
          for directory in server scripts docs tools; do
            if [ -d "$directory" ]; then touch "$directory/.gdignore"; fi
          done
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then exit 1; fi
      - name: Exportar Windows
        run: |
          set -euo pipefail
          mkdir -p build/windows/RespeitavelPublico
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Windows Desktop' build/windows/RespeitavelPublico/RespeitavelPublico.exe 2>&1 | tee build/windows-export.log
          test -s build/windows/RespeitavelPublico/RespeitavelPublico.exe
          (cd build/windows && zip -qr ../publish/RespeitavelPublico-Windows.zip RespeitavelPublico)
      - name: Exportar e verificar APK
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/android-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Android Preview' build/publish/RespeitavelPublico-Android.apk 2>&1 | tee build/android-export.log
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/publish/RespeitavelPublico-Android.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/publish/RespeitavelPublico-Android.apk | tee build/apk-info.txt
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          android=()
          if [ -f build/publish/RespeitavelPublico-Android.apk ]; then android=(--android RespeitavelPublico-Android.apk); fi
          python3 scripts/make_release_manifest.py --tag "$GITHUB_REF_NAME" --out build/publish/version.json --windows RespeitavelPublico-Windows.zip "${android[@]}"
          (cd build/publish && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" build/publish/* --repo "$GITHUB_REPOSITORY" --title "Respeitável Público $GITHUB_REF_NAME" --generate-notes --latest
      - name: Limpar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore"
