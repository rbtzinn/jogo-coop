name: Testes e versões
# Testa sempre. Uma tag v<VERSION_NAME> publica a versão nos Releases do GitHub
# (ZIP do Windows e, com a chave de assinatura configurada, APK do Android). Também dá para publicar
# sem enviar tag: "Run workflow" com o campo da versão (ex.: v0.4); o Release cria a tag no commit testado.
# A versão de navegador (iPhone e qualquer celular/PC) sai junto no GitHub Pages, separada do site da Vercel.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar esta versão (ex.: v0.4). Vazio: só testa.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-online-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar servidor
        working-directory: server
        run: npm ci --ignore-scripts && npm test
      - name: Instalar Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o engine.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Importar e verificar multitoque
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for directory in server scripts docs tools; do
            if [ -d "$directory" ]; then touch "$directory/.gdignore"; fi
          done
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 res://tests/test_mobile_controls.tscn 2>&1 | tee build/mobile-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/mobile-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_web_iphone.tscn 2>&1 | tee build/web-iphone-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/web-iphone-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 res://tests/test_carretel.tscn 2>&1 | tee build/carretel-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL |^ERROR:' build/carretel-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 res://tests/test_maestro.tscn 2>&1 | tee build/maestro-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL |^ERROR:' build/maestro-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_game_updates.tscn 2>&1 | tee build/update-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/update-tests.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_room_codes.tscn 2>&1 | tee build/room-code-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^FAIL ' build/room-code-tests.log; then exit 1; fi
      - name: Verificar partida completa via relay
        env:
          GODOT: Godot_v4.7.2-stable_linux.x86_64
        run: python3 tests/run_relay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-online-verificacoes
          path: build/*.log
          retention-days: 14
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
      HAS_STORE_IDENTITY: ${{ vars.MSIX_IDENTITY_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
      - name: Conferir versão da tag
        run: python3 scripts/make_release_manifest.py --tag "$RELEASE_TAG" --out /tmp/check.json --windows check.zip
      - name: Preparar assinatura permanente
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ALIAS" && test -n "$RELEASE_PASSWORD"
          python3 - <<'PY'
          import os, pathlib, base64
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.keystore'
          path.write_bytes(base64.b64decode(os.environ['RELEASE_KEY'], validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@v4
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar engine e templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -o engine.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q templates.tpz 'templates/android_release.apk' 'templates/windows_release_x86_64.exe' 'templates/web_nothreads_release.zip' 'templates/version.txt'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          if [ "$HAS_ANDROID_KEY" = true ]; then sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'; fi
      - name: Configurar exportador e importar
        run: |
          set -euo pipefail
          if [ "$HAS_ANDROID_KEY" = true ]; then
            python3 - <<'PY'
          import os, pathlib, json
          folder = pathlib.Path.home() / '.config/godot'
          folder.mkdir(parents=True, exist_ok=True)
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {'export/android/android_sdk_path': os.environ['ANDROID_HOME'], 'export/android/java_sdk_path': os.environ['JAVA_HOME']}.items():
              text += key + '=' + json.dumps(value) + '\n'
          (folder / 'editor_settings-4.7.tres').write_text(text)
          PY
          fi
          mkdir -p build/publish
          for directory in server scripts docs tools; do
            if [ -d "$directory" ]; then touch "$directory/.gdignore"; fi
          done
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' build/import.log; then exit 1; fi
      - name: Exportar Windows
        run: |
          set -euo pipefail
          mkdir -p build/windows/RespeitavelPublico
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Windows Desktop' build/windows/RespeitavelPublico/RespeitavelPublico.exe 2>&1 | tee build/windows-export.log
          test -s build/windows/RespeitavelPublico/RespeitavelPublico.exe
          (cd build/windows && zip -qr ../publish/RespeitavelPublico-Windows.zip RespeitavelPublico)
      - name: Exportar Windows para a Microsoft Store
        if: env.HAS_STORE_IDENTITY == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/store
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Windows Store' build/store/RespeitavelPublico.exe 2>&1 | tee build/store-export.log
          test -s build/store/RespeitavelPublico.exe
      - uses: actions/upload-artifact@v4
        if: env.HAS_STORE_IDENTITY == 'true'
        with:
          name: store-build
          path: build/store/RespeitavelPublico.exe
          if-no-files-found: error
          retention-days: 1
      - name: Exportar e verificar APK
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/android-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Android Preview' build/publish/RespeitavelPublico-Android.apk 2>&1 | tee build/android-export.log
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/publish/RespeitavelPublico-Android.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/publish/RespeitavelPublico-Android.apk | tee build/apk-info.txt
      - name: Exportar navegador
        run: |
          set -euo pipefail
          mkdir -p build/web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Web' build/web/index.html 2>&1 | tee build/web-export.log
          test -s build/web/index.pck && test -s build/web/index.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          android=()
          if [ -f build/publish/RespeitavelPublico-Android.apk ]; then android=(--android RespeitavelPublico-Android.apk); fi
          python3 scripts/make_release_manifest.py --tag "$RELEASE_TAG" --out build/publish/version.json --hash-dir build/publish --windows RespeitavelPublico-Windows.zip "${android[@]}"
          (cd build/publish && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" build/publish/* --repo "$GITHUB_REPOSITORY" --title "Respeitável Público $RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --latest
      - name: Limpar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore"
  web:
    # Versão de navegador no GitHub Pages (Settings > Pages > Source: GitHub Actions).
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  store:
    # Pacote da Microsoft Store. Sem assinatura: a Store assina ao publicar. Só roda numa versão
    # e quando as variáveis MSIX_* do repositório (dados do Partner Center) estão preenchidas.
    needs: release
    if: vars.MSIX_IDENTITY_NAME != ''
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /store/
            /scripts/
            /core/network/online_config.gd
      - uses: actions/download-artifact@v4
        with:
          name: store-build
          path: msix
      - name: Montar o pacote MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Recurse store/Assets msix/Assets
          python scripts/make_msix_manifest.py --identity-name $env:MSIX_IDENTITY_NAME --publisher $env:MSIX_PUBLISHER --publisher-display-name $env:MSIX_PUBLISHER_DISPLAY_NAME --out msix/AppxManifest.xml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw 'makeappx.exe não encontrado' }
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx.FullName pack /d msix /p out/RespeitavelPublico.msix /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: RespeitavelPublico-MicrosoftStore
          path: out/RespeitavelPublico.msix
          if-no-files-found: error
          retention-days: 30
