  <!-- pintinhas da cortiça -->
  <circle cx="76" cy="25" r="2.4" fill="#9a6a3a"/>
  <circle cx="90" cy="38" r="2" fill="#9a6a3a"/>
  <circle cx="104" cy="22" r="2.6" fill="#9a6a3a"/>
  <circle cx="113" cy="41" r="2" fill="#9a6a3a"/>
  <circle cx="84" cy="44" r="1.6" fill="#9a6a3a"/>
  <circle cx="98" cy="30" r="1.6" fill="#9a6a3a"/>
  <!-- reflexo -->
  <path d="M68 20 L122 18" stroke="#fff3d6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
