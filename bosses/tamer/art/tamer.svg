<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260" viewBox="0 0 180 260">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d0473b"/><stop offset="0.55" stop-color="#a3282a"/><stop offset="1" stop-color="#6e1c1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff0ab"/><stop offset="0.45" stop-color="#e2a72e"/><stop offset="1" stop-color="#9a6420"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#d9c9a6"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe0c2"/><stop offset="1" stop-color="#e2a982"/>
    </radialGradient>
  </defs>
  <g stroke="#1b1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- cauda do casaco (atrás) -->
    <path d="M118 150 Q150 190 142 222 L118 214 Q120 186 100 160 Z" fill="#6e1c1b"/>
    <!-- braço de trás, mão na cintura -->
    <path d="M118 112 Q142 128 132 152 Q124 160 112 156" fill="none" stroke-width="16"/>
    <path d="M118 112 Q142 128 132 152 Q124 160 112 156" fill="none" stroke="#8a2220" stroke-width="9"/>
    <!-- calças culote -->
    <path d="M58 168 Q36 196 60 214 L74 216 Q84 196 82 170 Z" fill="url(#pants)"/>
    <path d="M90 170 Q122 194 104 216 L90 216 Q84 196 86 172 Z" fill="url(#pants)"/>
    <!-- botas -->
    <path d="M60 210 L76 210 L78 246 Q60 254 34 252 Q30 240 50 238 L58 236 Z" fill="#2a1d18"/>
    <path d="M90 210 L106 210 L108 248 Q92 256 70 254 Q68 244 84 240 L90 238 Z" fill="#3a2a22"/>
    <!-- corpo / casaco -->
    <ellipse cx="88" cy="138" rx="46" ry="46" fill="url(#coat)"/>
    <!-- cinto -->
    <path d="M44 160 Q88 176 132 160 L130 172 Q88 188 46 172 Z" fill="#2a1d18"/>
    <rect x="76" y="164" width="20" height="16" rx="3" fill="url(#gold)" stroke-width="3"/>
  </g>
  <!-- alamares dourados no peito -->
  <g stroke="#e2a72e" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M60 116 Q76 112 92 116"/><path d="M58 130 Q76 126 94 130"/><path d="M60 144 Q76 140 92 144"/>
  </g>
  <g fill="url(#gold)" stroke="#1b1410" stroke-width="2">
    <circle cx="96" cy="116" r="4.5"/><circle cx="98" cy="130" r="4.5"/><circle cx="96" cy="144" r="4.5"/>
  </g>
  <!-- brilho do casaco -->
  <ellipse cx="104" cy="112" rx="16" ry="9" fill="#ffffff" opacity="0.18"/>
  <g stroke="#1b1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- dragona -->
    <path d="M100 96 Q126 92 134 110 L102 114 Z" fill="url(#gold)"/>
    <!-- cabeça -->
    <ellipse cx="80" cy="74" rx="32" ry="33" fill="url(#skin)"/>
    <!-- orelha -->
    <ellipse cx="108" cy="76" rx="8" ry="11" fill="#e8b08c"/>
    <!-- cartola -->
    <path d="M58 44 L62 4 Q84 -2 106 4 L104 44 Z" fill="#231a1a"/>
    <path d="M60 30 L104 30 L104 40 L59 40 Z" fill="#a3282a" stroke-width="3"/>
    <ellipse cx="82" cy="44" rx="40" ry="8" fill="#231a1a"/>
    <!-- nariz -->
    <circle cx="48" cy="78" r="11" fill="#e27d60"/>
  </g>
  <ellipse cx="45" cy="74" rx="4" ry="3" fill="#ffffff" opacity="0.6"/>
  <!-- olho e sobrancelha convencida -->
  <ellipse cx="66" cy="64" rx="6" ry="8" fill="#ffffff" stroke="#1b1410" stroke-width="2.5"/>
  <ellipse cx="63" cy="65" rx="3.4" ry="5" fill="#1b1410"/>
  <path d="M54 52 Q66 46 78 56" fill="none" stroke="#1b1410" stroke-width="5" stroke-linecap="round"/>
  <!-- bigode enrolado -->
  <path d="M50 88 Q36 86 30 96 Q28 106 38 104 Q34 98 42 96 Q50 96 56 92 Q66 98 76 94 Q90 102 96 96 Q100 88 92 88 Q94 94 86 92 Q74 86 62 88 Q56 84 50 88 Z" fill="#231a1a" stroke="#1b1410" stroke-width="2"/>
  <!-- boca sorrindo de lado -->
  <path d="M60 102 Q70 108 80 102" fill="none" stroke="#1b1410" stroke-width="3" stroke-linecap="round"/>
  <!-- braço da frente (segura o chicote) -->
  <g stroke-linecap="round">
    <path d="M66 112 Q48 122 40 132" fill="none" stroke="#1b1410" stroke-width="18"/>
    <path d="M66 112 Q48 122 40 132" fill="none" stroke="#b8322b" stroke-width="11"/>
  </g>
  <rect x="34" y="124" width="14" height="10" rx="3" fill="#f6ecd6" stroke="#1b1410" stroke-width="3" transform="rotate(-35 41 129)"/>
  <circle cx="36" cy="136" r="10" fill="#f6ecd6" stroke="#1b1410" stroke-width="3.5"/>
  <path d="M30 134 Q36 130 42 134" fill="none" stroke="#1b1410" stroke-width="2"/>
</svg>
